services:
  redis:
    image: redis:7-alpine
    container_name: knowledge-bot-redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: knowledge-bot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatdb
    ports:
      - "5433:5432"
    volumes:
      - ./knowledge-bot/db_data:/var/lib/postgresql/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: knowledge-bot-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./knowledge-bot/chroma_data:/chroma/chroma
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: knowledge-bot-minio
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./knowledge-bot/minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./knowledge-bot
      dockerfile: Dockerfile
    container_name: knowledge-bot-backend
    depends_on:
      - db
      - chromadb
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge-bot/data:/app/data
      - ./knowledge-bot/src:/app/src
      - ./knowledge-bot/api:/app/api
      - ./knowledge-bot/scripts:/app/scripts
    env_file:
      - ./knowledge-bot/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/chatdb
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:9010
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=enterprise-documents
      - S3_REGION=us-east-1
    restart: unless-stopped

  worker:
    build:
      context: ./knowledge-bot
      dockerfile: Dockerfile
    container_name: knowledge-bot-worker
    command: celery -A src.worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - db
      - chromadb
      - minio
    volumes:
      - ./knowledge-bot/data:/app/data
      - ./knowledge-bot/src:/app/src
    env_file:
      - ./knowledge-bot/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/chatdb
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:9010
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=enterprise-documents
      - S3_REGION=us-east-1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-bot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
