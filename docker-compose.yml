services:
  backend:
    build:
      context: ./knowledge-bot
      dockerfile: Dockerfile
    container_name: knowledge-bot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge-bot/data:/app/data
    env_file:
      - ./knowledge-bot/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-bot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
